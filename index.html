<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kasir Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Fraunces','Georgia','serif'],sans:['"Hanken Grotesk"','system-ui','sans-serif']}}}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:#F1F3EF;color:#1B2521;margin:0;font-variant-numeric:tabular-nums}
@media print{body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;left:0;top:0;width:280px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

// ================= KONFIGURASI (WAJIB DIISI) =================
const API_URL   = 'https://script.google.com/macros/s/AKfycbyTpYF1DExohzl5fG0JPuCB0RMwDuDEWJwaESzJ8cDoEaa-LJbZaBScivgZ0Pwia3Ou/exec'; // berakhiran /exec
const API_TOKEN = '325380';                                  // harus sama dengan SECRET_TOKEN di Code.gs
const NAMA_TOKO = 'KASIR RESTO & KAFE';

// ================= API =================
async function apiGet(action) {
  const r = await fetch(`${API_URL}?action=${action}&token=${encodeURIComponent(API_TOKEN)}`);
  return r.json();
}
async function apiPost(action, data = {}) {
  // text/plain agar tidak kena preflight CORS Apps Script
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: API_TOKEN, ...data })
  });
  return r.json();
}

// ================= HELPER =================
const rp = n => 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
const bool = v => v === true || v === 'TRUE' || v === 'true';
const isMinuman = i => !!i.suhu || /minum|kopi/i.test(i.kategori || '');
const mapP = r => ({ id: String(r.ID), nama: r.Nama, harga: Number(r.Harga) || 0, kategori: r.Kategori || 'Lainnya',
  aktif: bool(r.Aktif), gambar: r.Gambar || '', adaPilihanSuhu: bool(r.AdaSuhu), favorit: bool(r.Favorit) });
const mapT = r => ({ id: r.ID, tanggal: r.Tanggal, kasir: r.Kasir, items: r.Items || [], diskon: Number(r.Diskon) || 0,
  metodeBayar: r.MetodeBayar, total: Number(r.Total) || 0, bayar: Number(r.Bayar) || 0, kembalian: Number(r.Kembalian) || 0, status: r.Status });
function fileToDataUrl(file) {
  return new Promise(res => {
    const fr = new FileReader(), img = new Image();
    fr.onload = () => { img.onload = () => {
      const s = Math.min(1, 600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.8)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
const inp = 'w-full bg-white border border-[#D8DED6] rounded-xl px-3 py-2 text-sm outline-none focus:border-[#1F4034]';
const btn = 'rounded-xl font-bold text-xs px-4 py-2 cursor-pointer disabled:opacity-40';
const btnMain = btn + ' bg-[#1F4034] hover:bg-[#2B5646] text-[#F3EBDD]';
const btnLine = btn + ' border border-gray-300 bg-white';

// ================= APP =================
function App() {
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('kasir_user')); } catch (e) { return null; } });
  const [view, setView] = useState('kasir');
  const [produk, setProduk] = useState([]);
  const [transaksi, setTransaksi] = useState([]);
  const [cart, setCart] = useState({});
  const [toast, setToast] = useState('');
  const [busy, setBusy] = useState(false);
  const [loading, setLoading] = useState(true);
  const [receipt, setReceipt] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);

  const say = m => { setToast(m); setTimeout(() => setToast(''), 3000); };

  const load = useCallback(async () => {
    try {
      const [p, t] = await Promise.all([apiGet('getProduk'), apiGet('getTransaksi')]);
      if (!p.ok) throw new Error(p.error);
      if (!t.ok) throw new Error(t.error);
      setProduk(p.data.map(mapP));
      setTransaksi(t.data.map(mapT).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal)));
    } catch (e) { say('Gagal memuat data: ' + e.message); }
    setLoading(false);
  }, []);
  useEffect(() => { if (user) load(); }, [user]);

  const add = (p, suhu, d) => {
    const key = suhu ? `${p.id}_${suhu}` : p.id;
    setCart(c => {
      const n = (c[key]?.qty || 0) + d, next = { ...c };
      if (n <= 0) delete next[key];
      else next[key] = { cartItemId: key, id: p.id, nama: p.nama, harga: p.harga, kategori: p.kategori, suhu: suhu || null, qty: Math.min(99, n), catatan: c[key]?.catatan || '' };
      return next;
    });
  };
  const setCatatan = (key, v) => setCart(c => ({ ...c, [key]: { ...c[key], catatan: v } }));

  const simpan = async (status, metode, diskon, bayar) => {
    const items = Object.values(cart);
    if (!items.length || busy) return;
    const total = Math.max(0, items.reduce((s, i) => s + i.harga * i.qty, 0) - diskon);
    const payload = { kasir: user.nama, items, diskon, metodeBayar: metode, total, bayar, kembalian: Math.max(0, bayar - total), status };
    setBusy(true);
    try {
      const r = await apiPost('simpanTransaksi', payload);
      if (!r.ok) throw new Error(r.error);
      const tx = { ...payload, id: r.id, tanggal: r.tanggal };
      setTransaksi(t => [tx, ...t]);
      setCart({}); setCartOpen(false);
      if (status === 'Selesai') { setReceipt(tx); say('Pesanan selesai & tersimpan ke Sheet.'); }
      else say('Pesanan ditahan.');
    } catch (e) { say('Gagal menyimpan: ' + e.message); }
    setBusy(false);
  };

  const lanjutkan = async tx => {
    if (Object.keys(cart).length && !confirm('Pesanan saat ini akan diganti. Lanjutkan?')) return;
    setBusy(true);
    try {
      const r = await apiPost('lanjutkanTahan', { id: tx.id });
      if (!r.ok) throw new Error(r.error);
      const c = {};
      r.items.forEach(i => { c[i.cartItemId || i.id] = i; });
      setCart(c);
      setTransaksi(t => t.map(x => x.id === tx.id ? { ...x, status: 'Dilanjutkan' } : x));
      setView('kasir'); say('Pesanan dilanjutkan.');
    } catch (e) { say('Gagal: ' + e.message); }
    setBusy(false);
  };

  if (!user) return <Login onLogin={u => { localStorage.setItem('kasir_user', JSON.stringify(u)); setUser(u); }} />;
  const logout = () => { localStorage.removeItem('kasir_user'); setUser(null); setCart({}); };
  const owner = user.peran === 'Owner';
  const nItems = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  const tabs = [['kasir', 'Kasir'], ['laporan', 'Laporan'], ...(owner ? [['produk', 'Menu'], ['akun', 'Akun']] : [])];

  return (
    <div className="flex h-dvh overflow-hidden">
      <aside className="w-16 sm:w-20 bg-[#12241E] text-[#F3EBDD] flex flex-col items-center py-5 justify-between shrink-0">
        <div className="flex flex-col items-center gap-5">
          <div className="w-10 h-10 rounded-2xl bg-[#C2A06A] text-[#12241E] font-serif font-bold text-xl flex items-center justify-center">K</div>
          {tabs.map(([k, l]) => (
            <button key={k} onClick={() => { setView(k); setCartOpen(false); }}
              className={`w-12 h-11 rounded-2xl text-[10px] font-bold cursor-pointer ${view === k ? 'bg-[#1F4034] text-[#C2A06A]' : 'text-white/60 hover:bg-white/5'}`}>{l}</button>
          ))}
          <button onClick={load} title="Muat ulang dari Sheet" className="text-white/50 hover:text-white text-lg cursor-pointer">⟳</button>
        </div>
        <button onClick={logout} className="text-[10px] text-white/50 hover:text-white cursor-pointer">Keluar</button>
      </aside>

      <main className="flex-1 overflow-y-auto px-4 sm:px-8 py-6">
        <div className="max-w-6xl mx-auto">
          {loading && <div className="text-sm text-gray-500 mb-4">Memuat data dari Google Sheet…</div>}
          {view === 'kasir' && <Kasir produk={produk} cart={cart} add={add} tahan={transaksi.filter(t => t.status === 'Ditahan')} lanjutkan={lanjutkan} />}
          {view === 'laporan' && <Laporan transaksi={transaksi} tahan={lanjutkan} />}
          {view === 'produk' && owner && <Produk produk={produk} reload={load} say={say} />}
          {view === 'akun' && owner && <Akun say={say} me={user} />}
        </div>
      </main>

      {view === 'kasir' && <>
        <Order cart={cart} add={add} setCatatan={setCatatan} clear={() => setCart({})} simpan={simpan} busy={busy} open={cartOpen} close={() => setCartOpen(false)} />
        {nItems > 0 && !cartOpen && (
          <button onClick={() => setCartOpen(true)} className="md:hidden fixed left-4 right-4 bottom-5 z-30 h-14 rounded-2xl bg-[#1F4034] text-[#F3EBDD] px-5 flex justify-between items-center shadow-xl">
            <span className="font-semibold text-sm">Lihat Pesanan ({nItems})</span>
            <span className="font-serif font-bold">{rp(Object.values(cart).reduce((s, i) => s + i.harga * i.qty, 0))}</span>
          </button>)}
      </>}

      {receipt && <Struk tx={receipt} onClose={() => setReceipt(null)} />}
      {toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-[#12241E] text-[#F3EBDD] px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold">{toast}</div>}
    </div>
  );
}

// ================= LOGIN =================
function Login({ onLogin }) {
  const [u, setU] = useState(''), [p, setP] = useState(''), [err, setErr] = useState(''), [wait, setWait] = useState(false);
  const submit = async e => {
    e.preventDefault(); setWait(true); setErr('');
    try {
      const r = await apiPost('login', { username: u.trim(), password: p });
      if (!r.ok) throw new Error(r.error);
      onLogin({ nama: r.nama, username: r.username, peran: r.peran });
    } catch (x) { setErr(x.message || 'Gagal terhubung ke server'); }
    setWait(false);
  };
  return (
    <div className="min-h-dvh bg-[#12241E] flex items-center justify-center p-4">
      <form onSubmit={submit} className="bg-[#FCFBF7] rounded-3xl w-full max-w-sm p-8 shadow-2xl space-y-4">
        <div className="text-center">
          <div className="w-14 h-14 mx-auto rounded-3xl bg-[#1F4034] text-[#C2A06A] font-serif font-bold text-2xl flex items-center justify-center mb-2">K</div>
          <h1 className="font-serif text-2xl font-bold">Kasir Digital</h1>
        </div>
        <input className={inp} placeholder="Username" value={u} onChange={e => setU(e.target.value)} required autoCapitalize="none" />
        <input className={inp} type="password" placeholder="Kata sandi" value={p} onChange={e => setP(e.target.value)} required />
        {err && <div className="text-xs text-red-600">{err}</div>}
        <button disabled={wait} className={btnMain + ' w-full py-3 text-sm'}>{wait ? 'Memeriksa…' : 'Masuk'}</button>
      </form>
    </div>
  );
}

// ================= KASIR =================
function Kasir({ produk, cart, add, tahan, lanjutkan }) {
  const [q, setQ] = useState(''), [kat, setKat] = useState('Semua'), [showTahan, setShowTahan] = useState(false);
  const aktif = produk.filter(p => p.aktif);
  const kats = ['Semua', ...new Set(aktif.map(p => p.kategori))];
  const list = aktif.filter(p => (kat === 'Semua' || p.kategori === kat) && (p.nama + p.kategori).toLowerCase().includes(q.toLowerCase()));
  const qty = k => cart[k]?.qty || 0;

  const Step = ({ p, suhu, label, cls }) => {
    const k = suhu ? `${p.id}_${suhu}` : p.id, n = qty(k);
    return n === 0
      ? <button onClick={() => add(p, suhu, 1)} className={`py-1.5 rounded-xl border text-xs font-semibold cursor-pointer ${cls}`}>{label}</button>
      : <div className={`flex items-center justify-between rounded-xl border p-0.5 ${cls}`}>
          <button onClick={() => add(p, suhu, -1)} className="w-6 h-6 font-bold cursor-pointer">-</button>
          <span className="text-[11px] font-bold">{suhu ? label.split(' ')[0] : ''}{n}</span>
          <button onClick={() => add(p, suhu, 1)} className="w-6 h-6 font-bold cursor-pointer">+</button>
        </div>;
  };

  return (
    <div className="space-y-5 pb-24">
      <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 pb-2 border-b border-[#D8DED6]">
        <h1 className="font-serif font-bold text-2xl sm:text-3xl">Katalog Menu</h1>
        <div className="flex gap-2">
          <button onClick={() => setShowTahan(true)} className={btnLine}>Ditahan ({tahan.length})</button>
          <input className={inp + ' sm:w-64'} value={q} onChange={e => setQ(e.target.value)} placeholder="Cari menu…" />
        </div>
      </div>
      <div className="flex gap-2 overflow-x-auto">
        {kats.map(c => <button key={c} onClick={() => setKat(c)} className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap cursor-pointer ${kat === c ? 'bg-[#1F4034] text-[#F3EBDD]' : 'bg-[#FCFBF7] border border-[#D8DED6] text-[#56635B]'}`}>{c}</button>)}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
        {list.map(p => (
          <div key={p.id} className="bg-[#FCFBF7] rounded-2xl p-3 border border-[#D8DED6] flex flex-col justify-between">
            <div>
              <div className="aspect-[4/3] rounded-xl bg-[#E2EAE3] text-[#2A5344] flex items-center justify-center font-serif text-4xl font-bold overflow-hidden relative">
                {p.gambar ? <img src={p.gambar} alt="" className="w-full h-full object-cover" loading="lazy" /> : p.nama.charAt(0).toUpperCase()}
                {p.favorit && <span className="absolute top-2 right-2 bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">⭐</span>}
              </div>
              <h3 className="font-serif font-bold text-sm mt-2 line-clamp-1">{p.nama}</h3>
              <p className="text-[11px] text-[#56635B]">{p.kategori}</p>
            </div>
            <div className="mt-2 pt-2 border-t border-[#D8DED6]/60">
              <div className="font-bold text-sm text-[#7C5E2E] mb-2">{rp(p.harga)}</div>
              {p.adaPilihanSuhu
                ? <div className="grid grid-cols-2 gap-1.5">
                    <Step p={p} suhu="Dingin" label="❄️ Dingin" cls="bg-sky-50 border-sky-300 text-sky-900" />
                    <Step p={p} suhu="Panas" label="🔥 Panas" cls="bg-orange-50 border-orange-300 text-orange-900" />
                  </div>
                : <div className="grid"><Step p={p} suhu={null} label="+ Tambah" cls="bg-[#1F4034] border-[#1F4034] text-[#F3EBDD] [&_button]:text-[#F3EBDD]" /></div>}
            </div>
          </div>
        ))}
        {!list.length && <div className="col-span-full text-center text-sm text-gray-400 py-10">Tidak ada menu.</div>}
      </div>

      {showTahan && (
        <Modal title="Pesanan Ditahan" onClose={() => setShowTahan(false)}>
          {!tahan.length && <div className="text-sm text-gray-500 py-4 text-center">Tidak ada pesanan ditahan.</div>}
          {tahan.map(t => (
            <div key={t.id} className="flex justify-between items-center gap-2 py-2 border-b border-[#D8DED6] text-xs">
              <div><div className="font-bold">{new Date(t.tanggal).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} · {t.kasir}</div>
                <div className="text-gray-500">{t.items.map(i => `${i.nama} x${i.qty}`).join(', ')}</div></div>
              <button className={btnMain} onClick={() => { setShowTahan(false); lanjutkan(t); }}>Lanjutkan</button>
            </div>))}
        </Modal>)}
    </div>
  );
}

// ================= PANEL PESANAN =================
function Order({ cart, add, setCatatan, clear, simpan, busy, open, close }) {
  const [diskon, setDiskon] = useState(0), [metode, setMetode] = useState('Tunai'), [bayar, setBayar] = useState('');
  const items = Object.values(cart);
  const sub = items.reduce((s, i) => s + i.harga * i.qty, 0);
  const total = Math.max(0, sub - diskon);
  const bayarN = Number(bayar) || 0;
  const done = () => {
    if (metode === 'Tunai' && bayarN < total) return alert('Uang bayar kurang ' + rp(total - bayarN));
    simpan('Selesai', metode, diskon, metode === 'Tunai' ? bayarN : total).then(() => { setBayar(''); setDiskon(0); });
  };
  return (
    <aside className={`bg-[#E5E9E2] p-4 flex flex-col shrink-0 z-40 fixed md:static inset-x-0 bottom-0 top-14 md:top-auto rounded-t-[28px] md:rounded-none transition-transform w-full md:w-[360px] ${open ? 'translate-y-0' : 'translate-y-full md:translate-y-0'}`}>
      <div className="bg-[#FCFBF7] flex-1 min-h-0 p-5 flex flex-col rounded-lg">
        <div className="flex justify-between items-baseline pb-3 border-b border-dashed border-[#D8DED6]">
          <h2 className="font-serif font-bold text-xl">Pesanan</h2>
          <button onClick={close} className="md:hidden font-bold cursor-pointer">✕</button>
        </div>
        <div className="flex-1 overflow-y-auto my-2 divide-y divide-dotted divide-[#C9D0C8]">
          {!items.length && <div className="text-center text-gray-400 text-xs py-14">Belum ada item</div>}
          {items.map(i => (
            <div key={i.cartItemId} className="py-2 space-y-1 text-xs">
              <div className="flex justify-between gap-2"><b>{i.nama} {i.suhu && (i.suhu === 'Dingin' ? '❄️' : '🔥')}</b><b>{rp(i.harga * i.qty)}</b></div>
              <input value={i.catatan} onChange={e => setCatatan(i.cartItemId, e.target.value)} placeholder="catatan…" className="w-full text-[11px] italic bg-transparent border-b border-dashed border-gray-300 outline-none" />
              <div className="inline-flex items-center border border-[#D8DED6] rounded-full bg-white">
                <button onClick={() => add({ id: i.id, nama: i.nama, harga: i.harga, kategori: i.kategori }, i.suhu, -1)} className="w-7 h-6 font-bold cursor-pointer">-</button>
                <span className="min-w-6 text-center font-bold">{i.qty}</span>
                <button onClick={() => add({ id: i.id, nama: i.nama, harga: i.harga, kategori: i.kategori }, i.suhu, 1)} className="w-7 h-6 font-bold cursor-pointer">+</button>
              </div>
            </div>))}
        </div>
        <div className="shrink-0 pt-2 border-t border-[#D8DED6] space-y-1.5 text-xs">
          <div className="flex justify-between"><span>Subtotal</span><b>{rp(sub)}</b></div>
          <div className="flex justify-between items-center"><span>Diskon (Rp)</span>
            <input type="number" value={diskon || ''} onChange={e => setDiskon(Math.max(0, Number(e.target.value) || 0))} placeholder="0" className="w-24 text-right bg-transparent border-b border-gray-300 outline-none" /></div>
          <div className="flex justify-between items-baseline border-t border-[#1B2521] pt-1"><b className="font-serif">TOTAL</b><b className="font-serif text-2xl">{rp(total)}</b></div>
          <div className="grid grid-cols-3 border border-[#D8DED6] rounded-xl overflow-hidden bg-white/70">
            {['Tunai', 'QRIS', 'Transfer'].map(m => <button key={m} onClick={() => setMetode(m)} className={`py-1.5 font-semibold cursor-pointer ${metode === m ? 'bg-[#1F4034] text-[#F3EBDD]' : 'text-[#56635B]'}`}>{m}</button>)}
          </div>
          {metode === 'Tunai' && <div className="flex justify-between items-center"><span>Uang diterima</span>
            <input type="number" value={bayar} onChange={e => setBayar(e.target.value)} placeholder="0" className="w-28 text-right font-bold border-b border-gray-300 outline-none bg-transparent" /></div>}
          {metode === 'Tunai' && <div className="flex justify-between"><span>Kembalian</span><b className="text-emerald-700">{rp(Math.max(0, bayarN - total))}</b></div>}
          <button onClick={done} disabled={!items.length || busy} className={btnMain + ' w-full py-3 text-sm'}>{busy ? 'Menyimpan…' : `Selesaikan • ${rp(total)}`}</button>
          <div className="flex justify-between pt-1">
            <button onClick={() => simpan('Ditahan', metode, diskon, 0)} disabled={!items.length || busy} className="text-[#7C5E2E] font-bold hover:underline cursor-pointer disabled:opacity-40">Tahan Pesanan</button>
            <button onClick={clear} disabled={!items.length} className="text-red-600 hover:underline cursor-pointer disabled:opacity-40">Kosongkan</button>
          </div>
        </div>
      </div>
    </aside>
  );
}

// ================= LAPORAN =================
function Laporan({ transaksi }) {
  const selesai = transaksi.filter(t => t.status === 'Selesai' || t.status === 'MenungguKoreksi');
  const omset = selesai.reduce((s, t) => s + t.total, 0);
  return (
    <div className="space-y-6 pb-20">
      <h1 className="font-serif font-bold text-2xl sm:text-3xl pb-2 border-b border-[#D8DED6]">Laporan Penjualan</h1>
      <div className="grid sm:grid-cols-3 gap-4">
        {[['Total Pendapatan', rp(omset)], ['Total Transaksi', selesai.length + ' bon'], ['Rata-rata Tiket', rp(selesai.length ? Math.round(omset / selesai.length) : 0)]].map(([l, v]) => (
          <div key={l} className="p-5 rounded-2xl bg-[#FCFBF7] border border-[#D8DED6]"><span className="text-xs font-bold text-[#56635B] uppercase">{l}</span><div className="font-serif font-bold text-2xl mt-1">{v}</div></div>))}
      </div>
      <div className="bg-[#FCFBF7] border border-[#D8DED6] rounded-2xl overflow-x-auto">
        <table className="w-full text-left text-xs min-w-[640px]">
          <thead><tr className="bg-[#F1F3EF] text-[#56635B]">{['No.', 'Waktu', 'Kasir', 'Item', 'Metode', 'Status', 'Total'].map(h => <th key={h} className="p-3 font-bold">{h}</th>)}</tr></thead>
          <tbody className="divide-y divide-[#E7EBE4]">
            {!transaksi.length && <tr><td colSpan="7" className="p-8 text-center text-gray-400">Belum ada transaksi</td></tr>}
            {transaksi.map(t => (
              <tr key={t.id}>
                <td className="p-3 font-bold">{t.id}</td>
                <td className="p-3 text-gray-500">{new Date(t.tanggal).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' })}</td>
                <td className="p-3">{t.kasir}</td>
                <td className="p-3 text-gray-600">{t.items.map(i => `${i.nama}${i.suhu ? ` (${i.suhu})` : ''} x${i.qty}`).join(', ')}</td>
                <td className="p-3">{t.metodeBayar}</td><td className="p-3">{t.status}</td>
                <td className="p-3 font-bold text-[#7C5E2E]">{rp(t.total)}</td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ================= MENU (OWNER) =================
function Produk({ produk, reload, say }) {
  const empty = { id: null, nama: '', harga: '', kategori: 'Makanan', adaSuhu: false, favorit: false, gambar: '', preview: '' };
  const [f, setF] = useState(empty), [busy, setBusy] = useState(false);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const edit = p => { setF({ id: p.id, nama: p.nama, harga: String(p.harga), kategori: p.kategori, adaSuhu: p.adaPilihanSuhu, favorit: p.favorit, gambar: '', preview: p.gambar });
    window.scrollTo({ top: 0, behavior: 'smooth' }); document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' }); };
  const pilihFoto = async e => { const file = e.target.files[0]; if (!file) return; const d = await fileToDataUrl(file); setF(x => ({ ...x, gambar: d, preview: d })); };
  const submit = async e => {
    e.preventDefault();
    const harga = Number(String(f.harga).replace(/\D/g, ''));
    if (!f.nama.trim() || harga <= 0) return alert('Isi nama dan harga yang valid.');
    setBusy(true);
    const data = { nama: f.nama.trim(), harga, kategori: f.kategori.trim() || 'Lainnya', adaSuhu: f.adaSuhu, favorit: f.favorit, gambar: f.gambar };
    try {
      const r = await apiPost(f.id ? 'updateProduk' : 'tambahProduk', f.id ? { id: f.id, ...data } : data);
      if (!r.ok) throw new Error(r.error);
      say(f.id ? 'Menu diperbarui.' : 'Menu ditambahkan.'); setF(empty); await reload();
    } catch (x) { say('Gagal: ' + x.message); }
    setBusy(false);
  };
  const toggle = async p => {
    setBusy(true);
    try { const r = await apiPost(p.aktif ? 'hapusProduk' : 'aktifkanProduk', { id: p.id }); if (!r.ok) throw new Error(r.error); await reload(); }
    catch (x) { say('Gagal: ' + x.message); }
    setBusy(false);
  };
  return (
    <div className="space-y-8 pb-20">
      <h1 className="font-serif font-bold text-2xl sm:text-3xl pb-2 border-b border-[#D8DED6]">Manajemen Menu</h1>
      <form onSubmit={submit} className={`bg-[#FCFBF7] rounded-3xl p-6 border space-y-4 ${f.id ? 'border-amber-400 ring-2 ring-amber-300/50' : 'border-[#D8DED6]'}`}>
        <div className="flex justify-between"><h2 className="font-serif font-bold text-lg">{f.id ? 'Edit Menu' : 'Tambah Menu Baru'}</h2>
          {f.id && <button type="button" onClick={() => setF(empty)} className="text-xs underline cursor-pointer">Batal edit</button>}</div>
        <div className="grid sm:grid-cols-3 gap-4">
          <input className={inp} placeholder="Nama menu" value={f.nama} onChange={e => set('nama', e.target.value)} />
          <input className={inp} inputMode="numeric" placeholder="Harga (mis. 25000)" value={f.harga ? Number(String(f.harga).replace(/\D/g, '')).toLocaleString('id-ID') : ''} onChange={e => set('harga', e.target.value)} />
          <input className={inp} placeholder="Kategori" value={f.kategori} onChange={e => set('kategori', e.target.value)} list="kats" />
          <datalist id="kats">{['Makanan', 'Minuman', 'Minuman Kopi', 'Snack', 'Dessert'].map(c => <option key={c} value={c} />)}</datalist>
        </div>
        <div className="flex flex-wrap gap-4 items-center text-xs">
          <label className="flex gap-2 items-center cursor-pointer"><input type="checkbox" checked={f.adaSuhu} onChange={e => set('adaSuhu', e.target.checked)} /> Opsi Panas/Dingin</label>
          <label className="flex gap-2 items-center cursor-pointer"><input type="checkbox" checked={f.favorit} onChange={e => set('favorit', e.target.checked)} /> Favorit ⭐</label>
          <input type="file" accept="image/*" onChange={pilihFoto} />
          {f.preview && <img src={f.preview} className="w-12 h-12 rounded-lg object-cover" alt="" />}
        </div>
        <div className="text-right"><button disabled={busy} className={btnMain}>{busy ? 'Menyimpan…' : f.id ? 'Simpan Perubahan' : 'Simpan Menu'}</button></div>
      </form>
      <div className="bg-[#FCFBF7] border border-[#D8DED6] rounded-2xl overflow-x-auto">
        <table className="w-full text-xs text-left min-w-[560px]">
          <thead><tr className="bg-[#F1F3EF] text-[#56635B]">{['Menu', 'Harga', 'Kategori', 'Suhu', 'Status', 'Aksi'].map(h => <th key={h} className="p-3 font-bold">{h}</th>)}</tr></thead>
          <tbody className="divide-y divide-[#E7EBE4]">
            {produk.map(p => (
              <tr key={p.id}>
                <td className="p-3 font-bold">{p.nama} {p.favorit && '⭐'}</td>
                <td className="p-3 font-bold text-[#7C5E2E]">{rp(p.harga)}</td>
                <td className="p-3">{p.kategori}</td>
                <td className="p-3">{p.adaPilihanSuhu ? 'Panas/Dingin' : '-'}</td>
                <td className="p-3">{p.aktif ? 'Tersedia' : 'Nonaktif'}</td>
                <td className="p-3 space-x-3">
                  <button onClick={() => edit(p)} className="font-bold text-[#1F4034] cursor-pointer">Edit</button>
                  <button disabled={busy} onClick={() => toggle(p)} className={`cursor-pointer ${p.aktif ? 'text-red-600' : 'text-emerald-700'}`}>{p.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button>
                </td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ================= AKUN (OWNER) =================
function Akun({ say, me }) {
  const [list, setList] = useState([]), [f, setF] = useState({ nama: '', username: '', password: '', peran: 'Kasir' });
  const load = async () => { const r = await apiGet('getUser'); if (r.ok) setList(r.data); };
  useEffect(() => { load(); }, []);
  const tambah = async e => {
    e.preventDefault();
    const r = await apiPost('tambahUser', f);
    if (!r.ok) return say(r.error);
    say('Akun ditambahkan.'); setF({ nama: '', username: '', password: '', peran: 'Kasir' }); load();
  };
  const hapus = async u => {
    if (u.Username === me.username) return say('Tidak bisa menghapus akun yang sedang dipakai.');
    if (!confirm(`Hapus akun ${u.Nama}?`)) return;
    const r = await apiPost('hapusUser', { id: u.ID });
    say(r.ok ? 'Akun dihapus.' : r.error); load();
  };
  return (
    <div className="space-y-6 pb-20 max-w-2xl">
      <h1 className="font-serif font-bold text-2xl sm:text-3xl pb-2 border-b border-[#D8DED6]">Kelola Akun</h1>
      <form onSubmit={tambah} className="bg-[#FCFBF7] rounded-2xl p-5 border border-[#D8DED6] grid sm:grid-cols-2 gap-3">
        <input className={inp} placeholder="Nama" value={f.nama} onChange={e => setF({ ...f, nama: e.target.value })} required />
        <input className={inp} placeholder="Username" value={f.username} onChange={e => setF({ ...f, username: e.target.value })} required autoCapitalize="none" />
        <input className={inp} type="password" placeholder="Kata sandi" value={f.password} onChange={e => setF({ ...f, password: e.target.value })} required />
        <select className={inp} value={f.peran} onChange={e => setF({ ...f, peran: e.target.value })}><option>Kasir</option><option>Owner</option></select>
        <button className={btnMain + ' sm:col-span-2'}>Tambah Akun</button>
      </form>
      <div className="bg-[#FCFBF7] border border-[#D8DED6] rounded-2xl divide-y divide-[#E7EBE4]">
        {list.map(u => (
          <div key={u.ID} className="p-3 flex justify-between items-center text-xs">
            <div><b>{u.Nama}</b> <span className="text-gray-500">@{u.Username} · {u.Peran}</span></div>
            <button onClick={() => hapus(u)} className="text-red-600 font-bold cursor-pointer">Hapus</button>
          </div>))}
      </div>
    </div>
  );
}

// ================= STRUK 3 RANGKAP =================
function Struk({ tx, onClose }) {
  const [slip, setSlip] = useState('pelanggan');
  const items = slip === 'pelanggan' ? tx.items : slip === 'dapur' ? tx.items.filter(i => !isMinuman(i)) : tx.items.filter(isMinuman);
  return (
    <Modal title={`Struk • ${tx.id}`} onClose={onClose}>
      <div className="grid grid-cols-3 border-b border-[#D8DED6] text-xs font-bold text-center -mt-2 mb-3">
        {[['pelanggan', 'Pelanggan'], ['dapur', 'Dapur'], ['bar', 'Bar']].map(([k, l]) => (
          <button key={k} onClick={() => setSlip(k)} className={`py-2 cursor-pointer ${slip === k ? 'border-b-2 border-[#1F4034] text-[#1F4034]' : 'text-gray-500'}`}>{l}</button>))}
      </div>
      <div id="slip" className="font-mono text-xs space-y-2 bg-white p-3">
        <div className="text-center"><b className="text-sm">{NAMA_TOKO}</b>
          <div>{slip === 'pelanggan' ? 'STRUK PEMBAYARAN' : slip === 'dapur' ? 'TIKET DAPUR' : 'TIKET BAR'}</div>
          <div className="text-[10px] text-gray-500">{new Date(tx.tanggal).toLocaleString('id-ID')} • {tx.kasir}</div></div>
        <hr className="border-dashed border-gray-400" />
        {!items.length && <div className="text-center text-gray-400">Tidak ada item</div>}
        {items.map((i, n) => (
          <div key={n} className="flex justify-between"><div><b>{i.nama}{i.suhu ? ` [${i.suhu}]` : ''} x{i.qty}</b>{i.catatan && <div className="italic text-[10px]">* {i.catatan}</div>}</div>
            {slip === 'pelanggan' && <span>{rp(i.harga * i.qty)}</span>}</div>))}
        {slip === 'pelanggan' && <>
          <hr className="border-dashed border-gray-400" />
          {tx.diskon > 0 && <div className="flex justify-between"><span>Diskon</span><span>-{rp(tx.diskon)}</span></div>}
          <div className="flex justify-between font-bold text-sm"><span>TOTAL</span><span>{rp(tx.total)}</span></div>
          <div className="flex justify-between"><span>Bayar ({tx.metodeBayar})</span><span>{rp(tx.bayar)}</span></div>
          <div className="flex justify-between"><span>Kembali</span><span>{rp(tx.kembalian)}</span></div>
        </>}
      </div>
      <div className="flex justify-end gap-2 pt-3">
        <button className={btnMain} onClick={() => window.print()}>Cetak</button>
        <button className={btnLine} onClick={onClose}>Selesai</button>
      </div>
    </Modal>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
      <div className="bg-[#FCFBF7] rounded-3xl w-full max-w-sm shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
        <div className="p-4 px-5 bg-[#12241E] text-[#F3EBDD] flex justify-between items-center">
          <b className="font-serif">{title}</b><button onClick={onClose} className="cursor-pointer font-bold">✕</button>
        </div>
        <div className="p-5 overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
